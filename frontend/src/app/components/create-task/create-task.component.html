<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header bg-primary text-white">
          <h3 class="mb-0">Crear Nueva Tarea</h3>
        </div>
        <div class="card-body">
          <form [formGroup]="taskForm" (ngSubmit)="onSubmit()">
            <!-- Campo: Título -->
            <div class="mb-3">
              <label for="title" class="form-label">Título de la Tarea</label>
              <input
                type="text"
                class="form-control"
                id="title"
                formControlName="title"
                
                [class.is-invalid]="isTitleInvalid"
              />
              <div class="invalid-feedback d-block" *ngIf="isTitleInvalid">
                {{ titleError }}
              </div>
            </div>

            <!-- Campo: Horas Estimadas -->
            <div class="mb-3">
              <label for="estimateHours" class="form-label">Horas Estimadas</label>
              <input
                type="number"
                class="form-control"
                id="estimateHours"
                formControlName="estimateHours"
                
                [class.is-invalid]="isEstimateHoursInvalid"
              />
              <div class="invalid-feedback d-block" *ngIf="isEstimateHoursInvalid">
                {{ estimateHoursError }}
              </div>
            </div>

            <!-- Indicador de Carga -->
            <div *ngIf="isLoading()" class="alert alert-info">
              <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              Creando tarea...
            </div>

            <!-- Botones -->
            <div class="d-flex gap-2">
              <button
                type="submit"
                class="btn btn-primary flex-grow-1"
                [disabled]="taskForm.invalid || isLoading()"
              >
                <span *ngIf="!isLoading()">Crear Tarea</span>
                <span *ngIf="isLoading()">Guardando...</span>
              </button>
              <button
                type="button"
                class="btn btn-secondary"
                [disabled]="isLoading()"
                (click)="goBack()"
              >
                Cancelar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
