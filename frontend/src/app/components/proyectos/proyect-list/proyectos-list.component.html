<div class="container mt-5">
  <!-- Encabezado con título y botón + -->
  <div class="row mb-4">
    <div class="col-md-8">
      <h1>Mis Proyectos</h1>
    </div>
    <div class="col-md-4 text-end">
      <button
        class="btn btn-primary btn-lg btn-circle"
        (click)="navigateToCreateProject()"
        title="Crear nuevo proyecto"
      >
        +
      </button>
    </div>
  </div>

  <!-- Estado: Cargando -->
  <div *ngIf="isLoading()" class="text-center py-5">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-3">Cargando proyectos...</p>
  </div>

  <!-- Estado: Error - Usuario no identificado -->
  <div *ngIf="!hasUserId() && !isLoading()" class="alert alert-danger alert-dismissible fade show" role="alert">
    <strong>Error:</strong> {{ error() }}
  </div>

  <!-- Estado: Error - Petición fallida -->
  <div *ngIf="error() && hasUserId() && !isLoading()" class="alert alert-danger alert-dismissible fade show" role="alert">
    <strong>Error:</strong> {{ error() }}
  </div>

  <!-- Estado: Lista vacía -->
  <div *ngIf="!isLoading() && !error() && projects().length === 0 && hasUserId()" class="text-center py-5">
    <div class="alert alert-info">
      <p class="mb-3">No tienes proyectos creados.</p>
      <button class="btn btn-primary" (click)="navigateToCreateProject()">
        Crear tu primer proyecto
      </button>
    </div>
  </div>

  <!-- Estado: Grilla de proyectos -->
  <div *ngIf="!isLoading() && !error() && projects().length > 0" class="row g-3">
    <div
      *ngFor="let project of projects()"
      class="col-md-4 col-sm-6"
    >
      <div
        class="card project-card"
        (click)="navigateToProjectDetail(project.id)"
        role="button"
      >
        <div class="card-body">
          <h5 class="card-title">{{ project.name }}</h5>
        </div>
      </div>
    </div>
  </div>
</div>
