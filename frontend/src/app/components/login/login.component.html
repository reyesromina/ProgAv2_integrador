<div class="min-vh-100">
  <div class="container">
    <div class="card">
      <div class="card-body">

        <h2 class="card-title">Iniciar Sesión</h2>
        <p class="subtitle">Ingresa tus credenciales</p>

        <form [formGroup]="form" (ngSubmit)="login()">

          <div class="form-group">
            <label class="form-label" for="email">Email</label>

            <input
              id="email"
              type="email"
              class="form-control"
              formControlName="email">

            <div
              class="invalid-feedback"
              *ngIf="emailControl.touched && emailControl.invalid">

              <div *ngIf="emailControl.errors?.['required']">
                El email es obligatorio.
              </div>

              <div *ngIf="emailControl.errors?.['email']">
                Ingrese un email válido.
              </div>

            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Contraseña</label>

            <input
              id="password"
              type="password"
              class="form-control"
              formControlName="password">

            <div
              class="invalid-feedback"
              *ngIf="passwordControl.touched && passwordControl.invalid">

              <div *ngIf="passwordControl.errors?.['required']">
                La contraseña es obligatoria.
              </div>

            </div>
          </div>

          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="form.invalid">

            Ingresar

          </button>

        </form>

      </div>
    </div>
  </div>
</div>
